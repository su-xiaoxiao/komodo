name: Downstream localization
on:
  pull_request:
  push:
    branches: [integration/local-platform-zh-cn]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s adaptations/local-platform -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: yarn install --frozen-lockfile && yarn build && yarn link
        working-directory: client/core/ts
      - run: yarn install --frozen-lockfile && yarn link komodo_client
        working-directory: ui
      - run: yarn i18n:test && yarn i18n:check && yarn build
        working-directory: ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: localization-report
          path: ui/localization/reports/coverage.json
